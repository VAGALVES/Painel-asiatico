.","zh":["语法很难，但是很有意思。","yǔfǎ hěn nán, dànshì hěn yǒu yìsi","ü-fa rrên nan tan-chr rrên iôu i-s","ew-fah huhn nahn dahn-shr huhn yoh ee-sz"],"ja":["文法は 難しい ですが、おもしろい です。","ぶんぽう は むずかしい です が おもしろい です","bunpō wa muzukashii desu ga omoshiroi desu","bun-pô-ô ua mu-zu-ka-chi-i dê-su ga ô-mô-chi-rô-i dê-su","boon-poh-oh wah moo-zoo-kah-shee-ee deh-soo gah oh-moh-shee-roh-ee deh-soo"],"ko":["문법은 어렵지만 재미있어요.","munbeobeun eoryeopjjiman jaemiisseoyo","mun-bó-beun ó-rióp-tchi-man djé-mi-i-ssó-iô","moon-buh-beun uh-ryuhp-jjee-mahn jeh-mee-ee-ssuh-yoh"]},{"t":15,"pt":"Eu entendo um pouco.","en":"I understand a little.","zh":["我听得懂一点。","wǒ tīng de dǒng yìdiǎn","uô thing tê tung i-tien","woh teeng duh doong ee-dyen"],"ja":["少し 分かります。","すこし わかります","sukoshi wakarimasu","su-kô-chi ua-ka-ri-ma-su","soo-koh-shee wah-kah-ree-mah-soo"],"ko":["조금 알아들어요.","jogeum aradeureoyo","djô-geum a-ra-deu-ró-iô","joh-geum ah-rah-deu-ruh-yoh"]},{"t":15,"pt":"Eu não entendi.","en":"I didn\'t understand.","zh":["我没听懂。","wǒ méi tīngdǒng","uô mêi thing-tung","woh may teeng-doong"],"ja":["分かりませんでした。","わかりません でした","wakarimasen deshita","ua-ka-ri-ma-sên dê-chi-ta","wah-kah-ree-mah-sehn deh-shee-tah"],"ko":["이해 못 했어요.","ihae mot haesseoyo","i-rré môt rré-ssó-iô","ee-heh moht heh-ssuh-yoh"]},{"t":15,"pt":"Meu sotaque é ruim?","en":"Is my accent bad?","zh":["我的口音不好吗？","wǒ de kǒuyīn bù hǎo ma","uô tê khôu-in pu rrao ma","woh duh koh-een boo how mah"],"ja":["私の 発音は 変 ですか。","わたし の はつおん は へん ですか","watashi no hatsuon wa hen desu ka","ua-ta-chi nô rra-tsu-ôn ua rrên dê-su ka","wah-tah-shee noh hah-tsoo-ohn wah hehn deh-soo kah"],"ko":["제 발음이 이상해요?","je bareumi isanghaeyo","djê ba-reu-mi i-sang-rré-iô","jeh bah-reu-mee ee-sahng-heh-yoh"]},{"t":15,"pt":"Como se pronuncia esta palavra?","en":"How do you pronounce this word?","zh":["这个词怎么读？","zhège cí zěnme dú","djê-guê ts dzên-mê tu","juh-guh tsz dzuhn-muh doo"],"ja":["この 言葉は どう 読みますか。","この ことば は どう よみますか","kono kotoba wa dō yomimasu ka","kô-nô kô-tô-ba ua dô-ô iô-mi-ma eh-weh-eh-suh sahl-goh shee-puh-yoh"]},{"t":43,"pt":"Vou me mudar para outra cidade.","en":"I\'m going to move to another city.","zh":["我要搬到别的城市。","wǒ yào bān dào bié de chéngshì","uô iao pan tao piê tê tchêng-chr","woh yow bahn dow byeh duh chung-shr"],"ja":["別の 町に 引っ越します。","べつ の まち に ひっこします","betsu no machi ni hikkoshimasu","bê-tsu nô ma-tchi ni rrik-kô-chi-ma-su","beh-tsoo noh mah-chee nee heek-koh-shee-mah-soo"],"ko":["다른 도시로 이사할 거예요.","dareun dosiro isahal kkeoyeyo","da-reun dô-chi-rô i-sa-rral kkó-iê-iô","dah-reun doh-shee-roh ee-sah-hahl kkuh-yeh-yoh"]},{"t":43,"pt":"Vou começar um curso novo.","en":"I\'m going to start a new course.","zh":["我要开始一门新课程。","wǒ yào kāishǐ yì mén xīn kèchéng","uô iao khai-chr i mên chin khê-tchêng","woh yow keye-shr ee muhn sheen kuh-chung"],"ja":["新しい コースを 始めます。","あたらしい コース を はじめます","atarashii kōsu o hajimemasu","a-ta-ra-chi-i kô-ô-su ô rra-dji-mê-ma-su","ah-tah-rah-shee-ee koh-oh-soo oh hah-jee-meh-mah-soo"],"ko":["새 강의를 시작할 거예요.","sae ganguireul sijakal kkeoyeyo","sé gang-eui-reul chi-dja-kal kkó-iê-iô","seh gahng-eui-reul shee-jah-kahl kkuh-yeh-yoh"]},{"t":43,"pt":"Quero economizar para uma viagem.","en":"I want to save for a trip.","zh":["我想为旅行存钱。","wǒ xiǎng wèi lǚxíng cúnqián","uô chiang uêi lü-ching tsuên-tchien","woh shyahng way lew-sheeng tswun-chyen"],"ja":["旅行の ために 貯金 したい です。","りょこう の ため に ちょきん したい です","ryokō no tame ni chokin shitai desu","riô-kô-ô nô ta-mê ni tchô-quin chi-ta-i dê-su","ryoh-koh-oh noh tah-meh nee choh-keen shee-tah-ee deh-soo"],"ko":["여행을 위해 저축하고 싶어요.","yeohaengeul wihae jeochukago sipeoyo","ió-rréng-eul ui-rré djó-tchu-ka-gô chi-pó-iô","yuh-hehng-eul wee-heh juh-choo-kah-goh shee-puh-yoh"]},{"t":43,"pt":"Vamos fazer um plano juntos.","en":"Let\'s make a plan together.","zh":["我们一起做个计划吧。","wǒmen yìqǐ zuò gè jìhuà ba","uô-mên i-tchi dzuô guê dji-rrua pa","woh-muhn ee-chee dzwoh guh jee-hwah bah"],"ja":["一緒に 計画を 立てましょう。","いっしょ に けいかく を たてましょう","issho ni keikaku o tatemashō","is-chô ni quê-ê-ka-ku ô ta-t 。","こども の ころ いなか に すんで いました","kodomo no koro inaka ni sunde imashita","kô-dô-mô nô kô-rô i-na-ka ni sun-dê i-ma-chi-ta","koh-doh-moh noh koh-roh ee-nah-kah nee soon-deh ee-mah-shee-tah"],"ko":["어릴 때 시골에 살았어요.","eoril ttae sigore sarasseoyo","ó-ril tté chi-gô-rê sa-ra-ssó-iô","uh-reel tteh shee-goh-reh sah-rah-ssuh-yoh"]},{"t":44,"pt":"Eu estudei nesta escola.","en":"I studied at this school.","zh":["我在这所学校读过书。","wǒ zài zhè suǒ xuéxiào dú guo shū","uô dzai djê suô chüê-chiao tu guô chu","woh dzeye juh swoh shweh-shyow doo gwoh shoo"],"ja":["私は この 学校で 勉強 しました。","わたし は この がっこう で べんきょう しました","watashi wa kono gakkō de benkyō shimashita","ua-ta-chi ua kô-nô gak-kô-ô dê bên-kiô-ô chi-ma-chi-ta","wah-tah-shee wah koh-noh gahk-koh-oh deh behn-kyoh-oh shee-mah-shee-tah"],"ko":["저는 이 학교에서 공부했어요.","jeoneun i hakkkyoeseo gongbuhaesseoyo","djó-neun i rrak-kkiô-ê-só gông-bu-rré-ssó-iô","juh-neun ee hahk-kkyoh-eh-suh gohng-boo-heh-ssuh-yoh"]},{"t":44,"pt":"Eu já estive no Japão.","en":"I\'ve been to Japan.","zh":["我去过日本。","wǒ qù guo rìběn","uô tchü guô jr-pên","woh chew gwoh r-buhn"],"ja":["日本に 行った ことが あります。","にほん に いった こと が あります","nihon ni itta koto ga arimasu","ni-rrôn ni it-ta kô-tô ga a-ri-ma-su","nee-hohn nee eet-tah koh-toh gah ah-ree-mah-soo"],"ko":["일본에 가 본 적이 있어요.","ilbone ga bon jeogi isseoyo","il-bô-nê ga bôn djó-gui i-ssó-iô","eel-boh-neh gah bohn juh-gee ee-ssuh-yoh"]},{"t":44,"pt":"Eu nunca comi isso.","en":"I\'ve never eaten that.","zh":["我从来没吃过这个。","wǒ cónglái méi chī guo zhège","uô tsung-lai mêi tchr guô djê-guê","woh tsoong-leye may chr gwoh juh-guh"],"ja":["これを 食べた ことが ありません。","これ を たべた こと が ありません","kore o tabeta koto ga arimasen","kô-rê ô ta-bê-ta kô-tô ga a-ri-ma-sên","koh-reh oh tah-beh-tah koh-toh gah ah-ree-mah-sehn"],"ko":["이건 한 번도 먹어 본 적이 없어요.","igeon han beondo meogeo bon jeogi eopsseoyo","i-gón rran bón-dô mó-gó bôn djó-gui óp-ssó-iô","ee-guhn hahn buhn-doh muh-guh bohn juh-gee uhp-ssuh-yoh"]},{"t":44,"pt":"Faz muito tempo que não vejo você.","en":"It\'s
